# MiniMax H3 video styles — official H3 vocabulary (base-en.txt §4.1 + MiniMax-H3 repo skills).
# Use __mmh3/style__ or __mmh3/style/<name>__. Each entry is an observable descriptor.
mmh3:
  style:
    matchref1:
    - "[MATCHREF1] match <Picture 1>'s art style exactly — same illustration, linework and cel-shading; other references contribute content only, not style"
    - "[MATCHREF1] preserve <Picture 1>'s exact rendering style across every shot; the other reference images are used for their content only"
    matchref2:
    - "[MATCHREF2] match <Picture 2>'s art style exactly — same illustration, linework and cel-shading; other references contribute content only, not style"
    - "[MATCHREF2] preserve <Picture 2>'s exact rendering style across every shot; the other reference images are used for their content only"
    cinematic:
    - "[CINEMATIC] cinematic look, anamorphic framing, filmic color grading and shallow depth of field"
    - "[CINEMATIC] cinematic realism, dramatic lighting, lens flares and motion blur"
    liveaction:
    - "[LIVEACTION] live-action footage, natural skin tones, realistic textures and practical lighting"
    - "[LIVEACTION] documentary-style live-action, natural light and handheld realism"
    anime2d:
    - "[ANIME2D] 2D-animated style, clean linework, flat cel-shading and vivid colors"
    - "[ANIME2D] modern anime film look, painterly backgrounds and soft cel-shading"
    cg3d:
    - "[CG3D] 3D CG render, subsurface skin shading, ray-traced lighting and smooth surfaces"
    - "[CG3D] stylized 3D animated film look, soft global illumination and rounded forms"
    claymation:
    - "[CLAYMATION] claymation stop-motion, visible clay fingerprints, miniature sets and stepped frame timing"
    watercolor:
    - "[WATERCOLOR] watercolor painting look, soft pigment bleeds, paper texture and translucent washes"
    vintage:
    - "[VINTAGE] vintage film look, warm faded tones, halation, grain and gentle gate weave"
    - "[VINTAGE] 90s videotape aesthetic, chroma bleed, scanline softness and warm cast"
    papercraft:
    - "[PAPERCRAFT] papercraft stop-motion, layered cut-paper sets, visible paper edges and miniature depth"
    collage:
    - "[COLLAGE] paper collage look, flat cut-out shapes, mixed textures and bold graphic composition"
    handdrawn:
    - "[HANDDRAWN] hand-drawn sketch style, pencil linework, rough hatching and loose organic strokes"
