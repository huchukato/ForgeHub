# MiniMax H3 background music wildcards — fill non_diegetic_music.
# Use __mmh3/music__ to request a random style, or __mmh3/music/<name>__.
mmh3:
  music:
    orchestral:
    - "[MUSIC] an epic orchestral score with soaring strings and brass"
    - "[MUSIC] a cinematic orchestral soundtrack, slow build with strings and timpani"
    - "[MUSIC] a heroic orchestral theme, triumphant brass and full strings"
    electronic:
    - "[MUSIC] a slow ambient synthwave track with warm analog pads"
    - "[MUSIC] a dark synthwave background score with pulsing bass"
    - "[MUSIC] a deep house beat, relaxed and atmospheric"
    - "[MUSIC] a tense electronic drone with deep bass pulses"
    piano:
    - "[MUSIC] soft piano notes at a slow tempo, minimal and emotional"
    - "[MUSIC] a gentle piano melody joined by sustained low strings"
    jazz:
    - "[MUSIC] a smooth jazz background track with upright bass and brushed drums"
    - "[MUSIC] a slow smoky jazz lounge tune with soft saxophone"
    lofi:
    - "[MUSIC] a lo-fi hip hop beat, warm vinyl crackle and relaxed tempo"
    - "[MUSIC] a chill lo-fi track with soft keys and a laid-back groove"
    ambient:
    - "[MUSIC] a subtle ambient pad, barely audible atmospheric drone"
    - "[MUSIC] ethereal ambient music with soft sustained textures"
    tension:
    - "[MUSIC] a suspenseful cinematic score, sparse strings and low pulses"
    - "[MUSIC] a tense underscore with heartbeat-like percussion"
