name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forgehub-app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle backend (PyInstaller)
        shell: bash
        run: |
          pip install -e . pyinstaller
          pyinstaller packaging/backend_entry.py \
            --name forgehub-backend --onefile --noconfirm --clean \
            --distpath backend-dist --workpath backend-build \
            --paths . --collect-submodules uvicorn

      - name: Install and build
        working-directory: forgehub-app
        shell: bash
        run: |
          npm ci
          npm run build
          npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forgehub-${{ matrix.os }}
          path: |
            forgehub-app/release/*.dmg
            forgehub-app/release/*.exe
            forgehub-app/release/*.AppImage
            forgehub-app/release/*.deb
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: forgehub-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: "*"
          generate_release_notes: true
